<style>
  :root {
    --bg: #f5f7fa;
    --card: #fff;
    --ink: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent-dark: #1e40af;
    --consultant: #dbeafe;
    --consultant-ink: #1e3a8a;
    --maintenance: #fef3c7;
    --maintenance-ink: #78350f;
    --holiday: #fee2e2;
    --holiday-ink: #991b1b;
    --makeup: #ede9fe;
    --makeup-ink: #5b21b6;
    --good: #16a34a;
    --bad: #dc2626;
    --warn: #d97706;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
          "Microsoft JhengHei", sans-serif;
  }
  header.top {
    padding: 14px 20px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header.top h1 { margin: 0; font-size: 18px; }
  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .pill.admin { background: var(--accent); color: #fff; }
  .pill.member { background: var(--border); color: var(--ink); }
  .pill.unauth { background: var(--bad); color: #fff; }
  .user-info { margin-left: auto; color: var(--muted); font-size: 13px; }
  .container { padding: 16px 20px 64px; max-width: 1280px; margin: 0 auto; }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .toolbar button {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 6px 12px;
    cursor: pointer;
    border-radius: 6px;
    font-size: 13px;
  }
  .toolbar button:hover { background: var(--bg); }
  .toolbar .anchor {
    font-weight: 600;
    font-size: 15px;
    min-width: 120px;
    text-align: center;
  }
  .toolbar .spacer { flex: 1; }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .stat-card h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .stat-card .nums { display: flex; gap: 14px; font-size: 13px; }
  .stat-card .nums b { font-size: 17px; }
  .team-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  .team-table th, .team-table td {
    padding: 3px 6px;
    border-bottom: 1px solid var(--border);
    text-align: left;
  }
  .team-table td.num { text-align: right; font-variant-numeric: tabular-nums; }

  .months {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  @media (max-width: 1000px) { .months { grid-template-columns: 1fr; } }
  .month {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .month h2 {
    margin: 0;
    font-size: 14px;
    padding: 8px 10px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    text-align: center;
  }
  .dow-row, .week-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }
  .dow-row div {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    padding: 4px 0;
    border-bottom: 1px solid var(--border);
  }
  .day {
    min-height: 78px;
    padding: 4px;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    position: relative;
    background: var(--card);
    font-size: 11px;
    transition: background 0.1s;
  }
  .day:hover:not(.muted) { background: #f9fafb; }
  .day.muted { color: #d1d5db; background: #fafafa; cursor: default; }
  .day .num { font-weight: 600; font-size: 12px; }
  .day.today .num {
    background: var(--accent);
    color: #fff;
    border-radius: 50%;
    display: inline-block;
    width: 20px;
    height: 20px;
    text-align: center;
    line-height: 20px;
  }
  .day.weekend { background: #fafbfc; }
  .day.holiday { background: var(--holiday); }
  .day.holiday .num { color: var(--holiday-ink); }
  .day.makeup { background: var(--makeup); }
  .day.makeup .num { color: var(--makeup-ink); }
  .day .hname {
    font-size: 10px;
    color: var(--holiday-ink);
    margin-top: 1px;
  }
  .day.makeup .hname { color: var(--makeup-ink); }
  .chip {
    display: block;
    margin-top: 2px;
    padding: 1px 4px;
    border-radius: 3px;
    font-size: 10px;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chip.consultant { background: var(--consultant); color: var(--consultant-ink); }
  .chip.maintenance { background: var(--maintenance); color: var(--maintenance-ink); }
  .chip.unknown { background: var(--border); color: var(--ink); }

  /* Modal */
  .scrim {
    position: fixed; inset: 0;
    background: rgba(15, 23, 42, 0.4);
    display: none;
    align-items: center; justify-content: center;
    z-index: 100;
  }
  .scrim.show { display: flex; }
  .modal {
    background: var(--card);
    border-radius: 10px;
    width: 460px;
    max-width: 92vw;
    max-height: 90vh;
    overflow: auto;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  }
  .modal header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center;
  }
  .modal header h2 { margin: 0; font-size: 16px; }
  .modal header .close {
    margin-left: auto;
    background: transparent; border: none; cursor: pointer; font-size: 20px;
    color: var(--muted);
  }
  .modal .body { padding: 16px 18px; }
  .modal .footer {
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    display: flex; gap: 8px; justify-content: flex-end;
  }
  .modal label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .modal select, .modal input[type=text], .modal textarea {
    width: 100%;
    padding: 7px 9px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font: inherit;
    margin-bottom: 12px;
  }
  .modal textarea { min-height: 60px; resize: vertical; }
  .btn {
    padding: 7px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card);
    cursor: pointer;
    font: inherit;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { background: var(--accent-dark); }
  .btn.danger { background: var(--bad); color: #fff; border-color: var(--bad); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .verdict {
    padding: 10px 12px;
    border-radius: 6px;
    margin-top: 6px;
    font-size: 13px;
  }
  .verdict.allowed { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
  .verdict.rejected { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
  .verdict ul { margin: 6px 0 0 18px; padding: 0; }

  .existing-list {
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    padding: 6px 10px;
    margin-bottom: 12px;
    font-size: 12px;
    max-height: 120px;
    overflow: auto;
  }
  .existing-list .empty { color: var(--muted); }
  .existing-list .row {
    display: flex; align-items: center; gap: 8px;
    padding: 3px 0;
    border-bottom: 1px dashed var(--border);
  }
  .existing-list .row:last-child { border-bottom: none; }
  .existing-list .row .del {
    margin-left: auto;
    background: transparent; border: none; cursor: pointer;
    color: var(--bad); font-size: 12px;
  }

  .unauth-box {
    margin: 60px auto;
    max-width: 460px;
    padding: 32px;
    background: var(--card);
    border-radius: 10px;
    border: 1px solid var(--border);
    text-align: center;
  }
  .unauth-box h2 { margin: 0 0 12px; color: var(--bad); }

  .legend {
    display: flex;
    gap: 16px;
    font-size: 12px;
    color: var(--muted);
    margin: 12px 0 0;
    flex-wrap: wrap;
  }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend .sw {
    display: inline-block;
    width: 14px; height: 14px;
    border-radius: 3px;
    border: 1px solid rgba(0,0,0,0.1);
  }

  .toast {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: #fff;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 13px;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }
  .toast.bad { background: var(--bad); }
  .toast.good { background: var(--good); }

  .admin-link { color: var(--accent); text-decoration: none; font-size: 13px; }
  .admin-link:hover { text-decoration: underline; }
</style>
